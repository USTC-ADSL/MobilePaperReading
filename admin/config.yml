backend:
  name: github
  repo: USTC-ADSL/MobilePaperReading
  branch: main
  base_url: https://paper.adslab.icu
  auth_endpoint: api/admin/auth/begin

media_folder: docs/assets
public_folder: /assets
publish_mode: simple

collections:
  - name: papers
    label: 会议论文
    label_singular: 论文
    folder: docs/papers
    create: true
    delete: true
    identifier_field: title
    nested:
      depth: 10
      summary: "{{title}}"
      subfolders: false
    meta:
      path:
        widget: string
        label: 文件路径
        hint: 相对 docs/papers 的小写路径，例如 fast/24；Decap CMS 会将路径转换为小写。
        index_file: index
    fields:
      - label: 标题
        name: title
        widget: string
        required: true
      - label: 会议
        name: conference
        widget: string
        required: true
      - label: 笔记
        name: body
        widget: markdown
