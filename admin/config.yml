backend:
  name: github
  repo: USTC-ADSL/MobilePaperReading
  branch: main
  base_url: https://paper.adslab.icu
  auth_endpoint: api/admin/auth/begin

media_folder: docs/assets
public_folder: /assets
publish_mode: simple

collections:
  - name: papers
    label: 会议论文
    label_singular: 论文
    folder: docs/papers
    create: true
    delete: true
    identifier_field: title
    nested:
      depth: 10
      summary: "{{title}}"
      subfolders: false
    meta:
      path:
        widget: string
        label: 文件路径
        index_file: index
    fields:
      - label: 标题
        name: title
        widget: string
        required: true
      - label: 会议
        name: conference
        widget: string
        required: true
      - label: 年份
        name: year
        widget: number
        value_type: int
        min: 1900
        max: 2100
        default: 2024
      - label: 作者
        name: authors
        widget: list
        field:
          label: 作者
          name: author
          widget: string
      - label: 出处
        name: venue
        widget: string
        required: false
      - label: DOI 或链接
        name: link
        widget: string
        required: false
      - label: 阅读状态
        name: status
        widget: select
        options:
          - 待读
          - 阅读中
          - 已讨论
          - 已归档
        default: 待读
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 一句话摘要
        name: summary
        widget: text
        required: false
      - label: 研究问题
        name: research_question
        widget: text
        required: false
      - label: 主要观点
        name: key_points
        widget: text
        required: false
      - label: 小组讨论问题
        name: discussion
        widget: list
        field:
          label: 问题
          name: question
          widget: string
      - label: 笔记
        name: body
        widget: markdown
