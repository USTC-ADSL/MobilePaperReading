server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paper.adslab.icu;

    ssl_certificate /etc/letsencrypt/live/paper.adslab.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paper.adslab.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PAPERSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 50m;

    location = /git {
        return 301 /git/;
    }

    location ^~ /git/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /git;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    root /srv/paper-kb/site;

    location / {
        try_files $uri $uri/ =404;
    }
}

