services:
  gitea:
    image: gitea/gitea:1.24.7
    container_name: paper-gitea
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: paper.adslab.icu
      GITEA__server__ROOT_URL: https://paper.adslab.icu/git/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: paper.adslab.icu
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__PASSWORD_HASH_ALGO: argon2
      GITEA__cors__ENABLED: "true"
      GITEA__cors__ALLOW_DOMAIN: paper.adslab.icu
    volumes:
      - /data/services/paper-gitea:/data
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:2222:22"

